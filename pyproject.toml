[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfwin-payment-mcp"
version = "0.1.8"
description = "MCP server for LFWin payment order, query, refund, and refund status tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "mcp>=1.13.0",
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "python-dotenv==1.1.0",
    "qrcode[pil]==8.2",
]

[project.scripts]
payment-mcp = "payment_mcp.mcp_stdio:main"

[tool.setuptools]
packages = ["payment_mcp"]
